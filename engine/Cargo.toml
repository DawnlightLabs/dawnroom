[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "engine"
path = "src/main.rs"

# CLI.
[[bin]]
name = "dawnroom"
path = "src/cli/main.rs"

[dependencies]
async-stream = "0.3.6"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23.1"
clap = { version = "4", features = ["derive"] }
crc32fast = "1.5.5"
fastrand = "2.5.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls"] }
rmcp = { version = "3.10", features = ["server", "macros", "transport-io", "schemars"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1"
uuid = { version = "1.29.2", features = ["v4"] }
# Runtime zips from the sd.cpp release are stored/deflate only (checked by gen_runtimes.py).
zip = { version = "9.6.0", default-features = false, features = ["deflate"] }

[target."cfg(windows)".dependencies]
# DXGI adapter list (every GPU vendor), memory status and free disk space.
windows = { version = "0.62.2", features = ["Win32_Graphics_Dxgi", "Win32_Foundation", "Win32_System_SystemInformation", "Win32_Storage_FileSystem"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_System_Console", "Win32_System_Power"] }

[target."cfg(unix)".dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }

# Hashing 20 GB of weights in an unoptimized build takes minutes; optimize sha2 even in dev.
[profile.dev.package.sha2]
opt-level = 3
