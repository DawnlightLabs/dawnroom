# Hardware table: which devices exist, how much memory they have, and whether Dawnroom runs on them.
# The site reads it now (the "Will it run on my machine?" check); the engine will read it later.
# It lives in a subfolder because the engine parses every top-level registry/*.toml as a model manifest.
#
# Fields
#   family: vendor, backend (cuda | vulkan | rocm | metal | none), supported, notes, source shared by its devices
#   supported: "now" (Windows + NVIDIA, CUDA, tested on an RTX 5060 Laptop) | "experimental" (v0.1 through
#              Vulkan on Windows and Linux x86_64, not yet tested on that hardware) | "planned" (on the
#              roadmap after v0.1; /vision has the order) | "not planned"
#   device: name, match (lowercase fragments of a WebGL renderer string after "(R)", "(TM)", "™" and "®"
#           are removed; the longest match wins and a fragment must end at a word boundary), memory_gb (every size the chip ships with; several means
#           we ask the user), memory ("dedicated" by default, "unified" with usable_share: the part of
#           system memory the GPU may use, or "shared" for integrated graphics: memory_gb is then the
#           system RAM, and usable_share the part the GPU may use)
#
# Memory sizes come from the vendor pages in `source`, checked 2026-11-15 and (GTX 10, RX 9060 XT, Arc,
# M3 Ultra, Ryzen AI Max) re-checked 2026-11-16. Where no vendor page states a size, `source` says so. Fit is never decided here: the site
# compares a model's measured peak VRAM against this memory.

schema = 1

# ---------- NVIDIA (CUDA). The pinned sd.cpp build (master-1086-465adf3, CUDA 12.8.1) is compiled for
# compute capability 6.1 to 12.0 (61;70;75;80;86;89;90;100;120), which covers GTX 10 through RTX 50.
# On Linux x86_64, v0.1 runs NVIDIA cards through the Vulkan build (experimental); Linux CUDA comes later.

