# ---------- Integrated graphics (experimental), then what isn't used.

[[family]]
id = "integrated"
name = "Integrated graphics"
vendor = "other"
backend = "vulkan"
supported = "experimental"
notes = "Built-in graphics run through Vulkan (experimental) from system memory, so they're slow: a Fast image took about 3 minutes on Intel Arc 140T graphics, against 15 s on an RTX 5060 Laptop. Windows lets them use about half of system RAM (the engine reads the exact share). If this computer also has a separate GPU, Dawnroom uses that one instead."
source = "https://learn.microsoft.com/en-us/windows/win32/api/dxgi/ns-dxgi-dxgi_adapter_desc1 (SharedSystemMemory: the most system memory the adapter may use; 56% of 24 GB on a Core Ultra 7 255H, measured 2026-11-16)"
devices = [
  { id = "intel-integrated", name = "Intel integrated graphics (UHD, Iris Xe, Arc Graphics)", match = ["intel graphics", "intel uhd", "intel hd graphics", "intel iris", "intel arc graphics"], memory = "shared", usable_share = 0.5, memory_gb = [8, 16, 24, 32, 64] },
  { id = "amd-integrated", name = "AMD Radeon integrated graphics", match = ["radeon graphics", "radeon vega", "radeon 660m", "radeon 680m", "radeon 760m", "radeon 780m", "radeon 860m", "radeon 880m", "radeon 890m"], memory = "shared", usable_share = 0.5, memory_gb = [8, 16, 24, 32, 64] },
]

