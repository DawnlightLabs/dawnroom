note = "Slice 6b-3, instruction edit of one 1024x1024 image, 20 steps, cfg 4, euler, flow shift 3 (the recipe), through the engine, 24 GB RAM. sd.cpp's auto-fit plan: params 17337 MiB (DiT 12247 MiB, Qwen2.5-VL encoder + vision projector 5274 MiB, VAE); need = params + 2048 compute reserve. With 13 GB of RAM free at load its budget (11 GB) couldn't hold DiT + encoder, so the DiT streamed from disk (about 38 s a step) and warm is no faster than cold. With one reference image: 1169.1 s cold, 1150.3 s warm, peak 6880 MiB (12.8 GB RAM free before the cold run). Peak is nvidia-smi memory.used every 200 ms. Images excellent: the sign text changed in matching chalk lettering with the rest untouched, night relit the same scene, the hat from the reference sat on the cat."

