# Hand-written input for engine/scripts/gen_models.py, which writes registry/<id>.toml.
# Only what a person has to decide lives here: which model, which recipe, which files from which
# mirror. Revisions, sizes, sha256, licence ids and the gated flag come from the live Hugging Face
# API; steps, guidance and sampler come from sd-server's built-in recipe at the pinned sd.cpp commit
# (.ref/sdcpp-465adf3/examples/server/recipes/<recipe>.json), with `defaults` here on top.
#
# files    = what every size tag uses (text encoders, VAE): chosen so the smallest tag runs on 8 GB.
# variants = per size tag, the files that differ (usually the diffusion weights).
# licence  = only for licences the HF API reports as "other": read from the model card by hand.
#            Revenue-capped licences are `commercial = false` with the cap in the note: presets
#            only use models that are commercially clean for everyone.
# Mirrors: leejet, QuantStack, unsloth, city96, Comfy-Org, the model's own org, and the uploaders
# sd.cpp's own docs point to at 465adf3 (mradermacher, second-state, silveroxides, vantagewithai,
# realrebelai). Never a fine-tune, merge or uncensored model (RealVisXL is the one exception).

# Where each re-hosted file's bytes come from (generator: "provenance" in every manifest file).
# "=<org>/<repo>/<path>": the same bytes as that official file; the generator compares the sha256
# with the official repo's (its `?blobs=true` API shows LFS sha256 even for gated repos) and stops
# on a mismatch. Plain words: what the uploader did. Unlisted files: "official file" when they come
# from the model's own org, "quantised by <uploader>" for GGUFs; anything else must be listed here.
[provenance]
"Comfy-Org/Z-Image-Turbo/split_files/vae/ae.safetensors" = "=black-forest-labs/FLUX.1-schnell/ae.safetensors"
"Comfy-Org/Flux-2-Klein-4B/split_files/vae/flux2-vae.safetensors" = "=black-forest-labs/FLUX.2-dev/ae.safetensors"
"comfyanonymous/flux_text_encoders/clip_l.safetensors" = "=stabilityai/stable-diffusion-3.5-large/text_encoders/clip_l.safetensors"
"comfyanonymous/flux_text_encoders/t5xxl_fp8_e4m3fn.safetensors" = "=stabilityai/stable-diffusion-3.5-large/text_encoders/t5xxl_fp8_e4m3fn.safetensors"
"Comfy-Org/stable-diffusion-1.5/v1-5-pruned-emaonly-fp16.safetensors" = "fp16 copy of the official v1-5-pruned-emaonly checkpoint, by Comfy-Org (no official fp16 single file to compare)"
"madebyollin/sdxl-vae-fp16-fix/sdxl.vae.safetensors" = "SDXL VAE fine-tuned by madebyollin to run in fp16 (not the official bytes, by design)"
"QuantStack/Qwen-Image-GGUF/VAE/Qwen_Image-VAE.safetensors" = "Qwen-Image VAE repacked by QuantStack (the official file is diffusers-format; no byte match)"
"Comfy-Org/Qwen-Image-2.1/vae/qwen_image_2.1_vae_bf16.safetensors" = "Qwen-Image 2.1 VAE repacked to ComfyUI format by Comfy-Org (no byte match)"
"Comfy-Org/Qwen-Image-2.1/diffusion_models/qwen_image_2.1_turbo_bf16.safetensors" = "repacked to a single bf16 file by Comfy-Org from the official sharded weights (no byte match)"
"Comfy-Org/Wan_2.1_ComfyUI_repackaged/split_files/vae/wan_2.1_vae.safetensors" = "Wan 2.1 VAE repacked to safetensors by Comfy-Org (the official file is .pth; no byte match)"
"Comfy-Org/Wan-2.1/split_files/vae/wan_2.1_vae.safetensors" = "Wan 2.1 VAE repacked to safetensors by Comfy-Org (the official file is .pth; no byte match)"
"Comfy-Org/Chroma1-Radiance/split_files/diffusion_models/chroma-radiance-x0.safetensors" = "Chroma1-Radiance x0 repacked by Comfy-Org (differs from lodestones' latest_x0.safetensors; no byte match)"
"Comfy-Org/HiDream-O1-Image/checkpoints/hidream_o1_image_dev_bf16.safetensors" = "single-file bf16 repack by Comfy-Org of the official weights (no byte match)"
"Comfy-Org/Fibo-2.0/diffusion_models/fibo2_dev_int8_convrot.safetensors" = "quantised to int8 convrot by Comfy-Org"
"Comfy-Org/Fibo-2.0/diffusion_models/fibo2_dev_bf16.safetensors" = "single-file bf16 repack by Comfy-Org of the official weights (no byte match)"
"Comfy-Org/Ovis-Image/split_files/text_encoders/ovis_2.5.safetensors" = "Ovis 2.5 text encoder repacked by Comfy-Org (no byte match)"
"Comfy-Org/Fibo-2.0/diffusion_models/fibo2_edit_turbo_int8_convrot.safetensors" = "quantised to int8 convrot by Comfy-Org"
"Comfy-Org/Fibo-2.0/diffusion_models/fibo2_edit_turbo_bf16.safetensors" = "single-file bf16 repack by Comfy-Org of the official weights (no byte match)"

